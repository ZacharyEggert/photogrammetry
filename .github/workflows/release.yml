name: Release

on:
  push:
    # Coarse filter; the version check below is the real gate.
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    # actool needs the Xcode that ships Icon Composer support to compile Resources/Appicon.icon.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # CFBundleShortVersionString must be one to three dot-separated integers, so a tag
      # like v1.2.3-beta would build an app macOS reads as malformed. Reject it up front.
      - name: Check tag is a plain version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){0,2}$' || {
              echo "tag $GITHUB_REF_NAME is not v<major>[.minor[.patch]] with integer parts"
              exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # MARKETING_VERSION is the single source: Info.plist reads $(MARKETING_VERSION) and
      # build-app.sh expands it, so stamping the xcodeproj covers both build paths.
      - name: Stamp version from tag
        run: |
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = $VERSION;/" \
            Photogrammetry.xcodeproj/project.pbxproj

      # Into a throwaway keychain, never the login one; the runner is discarded either way
      # but this keeps the key out of any state a later step could read by accident.
      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ { print $2; exit }')
          test -n "$IDENTITY" || { echo "no Developer ID Application identity in the .p12"; exit 1; }
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - run: ./build-app.sh

      - name: Verify build
        run: |
          BUILT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            Photogrammetry.app/Contents/Info.plist)
          test "$BUILT" = "$VERSION" || { echo "version $BUILT != tag $VERSION"; exit 1; }
          codesign --verify --deep --strict --verbose=2 Photogrammetry.app

      # ditto, not zip: it keeps the bundle's symlinks and the signature intact.
      - run: ditto -c -k --sequesterRsrc --keepParent Photogrammetry.app Photogrammetry.zip

      # Notarization reads the zip, but the ticket staples to the .app, so re-zip after.
      - name: Notarize and staple
        env:
          API_KEY: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit Photogrammetry.zip \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple Photogrammetry.app
          rm Photogrammetry.zip
          ditto -c -k --sequesterRsrc --keepParent Photogrammetry.app Photogrammetry.zip

      # What Gatekeeper will say on a machine that has never seen the app.
      - run: spctl --assess --type exec --verbose=4 Photogrammetry.app

      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Photogrammetry.zip
                --title "$GITHUB_REF_NAME"
                --generate-notes
